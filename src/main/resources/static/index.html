<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .item-card {
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: translateY(-5px);
        }
        .bid-history {
            max-height: 200px;
            overflow-y: auto;
        }
        .auth-form {
            max-width: 400px;
            margin: 0 auto;
        }
        .auth-toggle {
            cursor: pointer;
            color: #0d6efd;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Watch Marketplace</h1>
        
        <!-- Auth Section -->
        <div id="authSection" class="mb-4">
            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <h3>Login</h3>
                <div class="mb-3">
                    <input type="email" id="loginEmail" class="form-control" placeholder="Email">
                </div>
                <div class="mb-3">
                    <input type="password" id="loginPassword" class="form-control" placeholder="Password">
                </div>
                <button onclick="login()" class="btn btn-primary">Login</button>
                <p class="mt-3">
                    Don't have an account? 
                    <span class="auth-toggle" onclick="toggleAuthForm()">Register here</span>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="auth-form" style="display: none;">
                <h3>Register</h3>
                <div class="mb-3">
                    <input type="text" id="registerUsername" class="form-control" placeholder="Username">
                </div>
                <div class="mb-3">
                    <input type="email" id="registerEmail" class="form-control" placeholder="Email">
                </div>
                <div class="mb-3">
                    <input type="password" id="registerPassword" class="form-control" placeholder="Password">
                </div>
                <div class="mb-3">
                    <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Confirm Password">
                </div>
                <button onclick="register()" class="btn btn-primary">Register</button>
                <p class="mt-3">
                    Already have an account? 
                    <span class="auth-toggle" onclick="toggleAuthForm()">Login here</span>
                </p>
            </div>
        </div>

        <!-- Items Section -->
        <div id="itemsSection" style="display: none;">
            <div class="row" id="itemsList">
                <!-- Items will be populated here -->
            </div>
        </div>
    </div>

    <!-- Item Modal -->
    <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Item Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="itemDetails"></div>
                    <div class="mt-3">
                        <h6>Place Bid</h6>
                        <div class="input-group mb-3">
                            <input type="number" id="bidAmount" class="form-control" placeholder="Bid amount">
                            <button class="btn btn-primary" onclick="placeBid()">Place Bid</button>
                        </div>
                    </div>
                    <div class="mt-3">
                        <h6>Bid History</h6>
                        <div id="bidHistory" class="bid-history"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" onclick="buyNow()">Buy Now</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentToken = '';
        let currentItemId = null;
        const modal = new bootstrap.Modal(document.getElementById('itemModal'));

        function toggleAuthForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                alert('Please enter both email and password');
                return;
            }

            try {
                console.log('Attempting login with:', { email });
                const response = await fetch('/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                console.log('Login response status:', response.status);
                const responseText = await response.text();
                console.log('Login response:', responseText);

                if (response.ok) {
                    const data = JSON.parse(responseText);
                    console.log('Login successful, received token');
                    currentToken = data.token;
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('itemsSection').style.display = 'block';
                    loadItems();
                } else {
                    alert('Login failed: ' + responseText);
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('An error occurred during login. Please check the console for details.');
            }
        }

        async function register() {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            if (!username || !email || !password) {
                alert('Please fill in all required fields');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            try {
                console.log('Attempting registration with:', { username, email });
                const response = await fetch('/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                console.log('Registration response status:', response.status);
                const responseText = await response.text();
                console.log('Registration response:', responseText);

                if (response.ok) {
                    alert('Registration successful! Please login.');
                    toggleAuthForm(); // Switch to login form
                } else {
                    alert('Registration failed: ' + responseText);
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('An error occurred during registration. Please check the console for details.');
            }
        }

        async function loadItems() {
            try {
                const response = await fetch('/items', {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const items = await response.json();
                const itemsList = document.getElementById('itemsList');
                itemsList.innerHTML = '';

                items.forEach(item => {
                    const itemCard = `
                        <div class="col-md-4">
                            <div class="card item-card">
                                <div class="card-body">
                                    <h5 class="card-title">${item.title}</h5>
                                    <p class="card-text">${item.description}</p>
                                    <p class="card-text">
                                        <strong>Price:</strong> $${item.price}<br>
                                        ${item.biddingEnabled ? `<strong>Current Bid:</strong> $${item.currentPrice}<br>` : ''}
                                        <strong>Buy Now:</strong> $${item.buyNowPrice}
                                    </p>
                                    <button class="btn btn-primary" onclick="showItemDetails(${item.id})">
                                        View Details
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    itemsList.innerHTML += itemCard;
                });
            } catch (error) {
                console.error('Error loading items:', error);
                alert('Error loading items. Please try logging in again.');
                // If there's an error, show the auth section again
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('itemsSection').style.display = 'none';
            }
        }

        async function showItemDetails(itemId) {
            currentItemId = itemId;
            try {
                const [itemResponse, bidsResponse] = await Promise.all([
                    fetch(`/items/${itemId}`),
                    fetch(`/items/${itemId}/bids`)
                ]);

                const item = await itemResponse.json();
                const bids = await bidsResponse.json();

                document.getElementById('itemDetails').innerHTML = `
                    <h4>${item.title}</h4>
                    <p>${item.description}</p>
                    <p><strong>Current Price:</strong> $${item.price}</p>
                    <p><strong>Buy Now Price:</strong> $${item.buyNowPrice}</p>
                `;

                const bidHistory = document.getElementById('bidHistory');
                bidHistory.innerHTML = bids.map(bid => `
                    <div class="border-bottom p-2">
                        <small>Bid: $${bid.amount} by ${bid.user.email}</small>
                    </div>
                `).join('');

                modal.show();
            } catch (error) {
                console.error('Error loading item details:', error);
                alert('Error loading item details.');
            }
        }

        async function placeBid() {
            const amount = document.getElementById('bidAmount').value;
            if (!amount || amount <= 0) {
                alert('Please enter a valid bid amount.');
                return;
            }

            try {
                const response = await fetch(`/items/${currentItemId}/bid?amount=${amount}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                if (response.ok) {
                    alert('Bid placed successfully!');
                    showItemDetails(currentItemId);
                } else {
                    alert('Failed to place bid. Please try again.');
                }
            } catch (error) {
                console.error('Error placing bid:', error);
                alert('Error placing bid.');
            }
        }

        async function buyNow() {
            try {
                const response = await fetch(`/items/${currentItemId}/buy-now`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                if (response.ok) {
                    alert('Item purchased successfully!');
                    modal.hide();
                    loadItems();
                } else {
                    alert('Failed to purchase item. Please try again.');
                }
            } catch (error) {
                console.error('Error buying item:', error);
                alert('Error buying item.');
            }
        }
    </script>
</body>
</html>
