<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .item-card {
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: translateY(-5px);
        }
        .bid-history {
            max-height: 200px;
            overflow-y: auto;
        }
        .auth-form {
            max-width: 400px;
            margin: 0 auto;
        }
        .auth-toggle {
            cursor: pointer;
            color: #0d6efd;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Watch Marketplace</h1>
        
        <!-- Auth Section -->
        <div id="authSection" class="mb-4">
            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <h3>Login</h3>
                <div class="mb-3">
                    <input type="email" id="loginEmail" class="form-control" placeholder="Email">
                </div>
                <div class="mb-3">
                    <input type="password" id="loginPassword" class="form-control" placeholder="Password">
                </div>
                <button onclick="login()" class="btn btn-primary">Login</button>
                <p class="mt-3">
                    Don't have an account? 
                    <span class="auth-toggle" onclick="toggleAuthForm()">Register here</span>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="auth-form" style="display: none;">
                <h3>Register</h3>
                <div class="mb-3">
                    <input type="text" id="registerUsername" class="form-control" placeholder="Username">
                </div>
                <div class="mb-3">
                    <input type="email" id="registerEmail" class="form-control" placeholder="Email">
                </div>
                <div class="mb-3">
                    <input type="password" id="registerPassword" class="form-control" placeholder="Password">
                </div>
                <div class="mb-3">
                    <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Confirm Password">
                </div>
                <button onclick="register()" class="btn btn-primary">Register</button>
                <p class="mt-3">
                    Already have an account? 
                    <span class="auth-toggle" onclick="toggleAuthForm()">Login here</span>
                </p>
            </div>
        </div>

        <!-- Items Section -->
        <div id="itemsSection" style="display: none;">
            <div class="row mb-4">
                <div class="col">
                    <button class="btn btn-primary" onclick="showCreateItemForm()">Add New Item</button>
                </div>
                <div class="col text-end">
                    <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
                </div>
            </div>
            <div class="row" id="itemsList">
                <!-- Items will be populated here -->
            </div>
        </div>
    </div>

    <!-- Item Modal -->
    <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Item Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="itemDetails"></div>
                    <div class="mt-3">
                        <h6>Place Bid</h6>
                        <div class="input-group mb-3">
                            <input type="number" id="bidAmount" class="form-control" placeholder="Bid amount">
                            <button class="btn btn-primary" onclick="placeBid()">Place Bid</button>
                        </div>
                    </div>
                    <div class="mt-3">
                        <h6>Bid History</h6>
                        <div id="bidHistory" class="bid-history"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" onclick="buyNow()">Buy Now</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Item Modal -->
    <div class="modal fade" id="createItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createItemForm">
                        <div class="mb-3">
                            <label for="itemTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="itemTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="itemDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="itemDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="enableBidding">
                            <label class="form-check-label" for="enableBidding">Enable Bidding</label>
                        </div>
                        <div id="regularPriceSection">
                            <div class="mb-3">
                                <label for="itemPrice" class="form-label">Price</label>
                                <input type="number" class="form-control" id="itemPrice" min="0" step="0.01">
                            </div>
                        </div>
                        <div id="biddingOptions" style="display: none;">
                            <div class="mb-3">
                                <label for="startingPrice" class="form-label">Starting Price</label>
                                <input type="number" class="form-control" id="startingPrice" min="0" step="0.01">
                            </div>
                            <div class="mb-3">
                                <label for="itemBuyNowPrice" class="form-label">Buy Now Price</label>
                                <input type="number" class="form-control" id="itemBuyNowPrice" min="0" step="0.01">
                            </div>
                            <div class="mb-3">
                                <label for="endTime" class="form-label">End Time</label>
                                <input type="datetime-local" class="form-control" id="endTime">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createItem()">Create Item</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentToken = '';
        let currentItemId = null;
        const modal = new bootstrap.Modal(document.getElementById('itemModal'));
        const createItemModal = new bootstrap.Modal(document.getElementById('createItemModal'));

        function toggleAuthForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                alert('Please enter both email and password');
                return;
            }

            try {
                console.log('Attempting login with:', { email });
                const response = await fetch('/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                console.log('Login response status:', response.status);
                const responseText = await response.text();
                console.log('Login response text:', responseText);

                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        console.log('Parsed login response:', data);
                        
                        if (!data.token) {
                            console.error('No token in response:', data);
                            throw new Error('No token received from server');
                        }
                        
                        // Store token in localStorage
                        localStorage.setItem('token', data.token);
                        currentToken = data.token;
                        console.log('Token stored successfully');
                        
                        // Clear the login form
                        document.getElementById('loginEmail').value = '';
                        document.getElementById('loginPassword').value = '';
                        
                        // Show items section
                        document.getElementById('authSection').style.display = 'none';
                        document.getElementById('itemsSection').style.display = 'block';
                        
                        // Load items
                        await loadItems();
                    } catch (parseError) {
                        console.error('Error parsing login response:', parseError);
                        console.error('Response text was:', responseText);
                        alert('Invalid response from server. Please try again.');
                    }
                } else {
                    console.error('Login failed with status:', response.status);
                    console.error('Response text:', responseText);
                    alert('Login failed: ' + responseText);
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('An error occurred during login. Please check the console for details.');
            }
        }

        async function register() {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            if (!username || !email || !password) {
                alert('Please fill in all required fields');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            try {
                console.log('Attempting registration with:', { username, email });
                const response = await fetch('/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                console.log('Registration response status:', response.status);
                const responseText = await response.text();
                console.log('Registration response:', responseText);

                if (response.ok) {
                    alert('Registration successful! Please login.');
                    // Clear the registration form
                    document.getElementById('registerUsername').value = '';
                    document.getElementById('registerEmail').value = '';
                    document.getElementById('registerPassword').value = '';
                    document.getElementById('registerConfirmPassword').value = '';
                    toggleAuthForm(); // Switch to login form
                } else {
                    console.error('Registration failed with status:', response.status);
                    console.error('Response text:', responseText);
                    alert('Registration failed: ' + responseText);
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('An error occurred during registration. Please check the console for details.');
            }
        }

        // Add this function to get the current token
        function getCurrentToken() {
            const token = localStorage.getItem('token');
            if (!token) {
                showLoginForm();
                throw new Error('No authentication token found');
            }
            return token;
        }

        async function showItemDetails(itemId) {
            currentItemId = itemId;
            try {
                const token = getCurrentToken();
                console.log('Loading item details for ID:', itemId);

                const [itemResponse, bidsResponse] = await Promise.all([
                    fetch(`/items/${itemId}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    }),
                    fetch(`/items/${itemId}/bids`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    })
                ]);

                if (!itemResponse.ok) {
                    throw new Error(`Failed to load item details: ${itemResponse.status}`);
                }

                if (!bidsResponse.ok) {
                    throw new Error(`Failed to load bid history: ${bidsResponse.status}`);
                }

                const item = await itemResponse.json();
                const bids = await bidsResponse.json();

                console.log('Item details:', item);
                console.log('Bid history:', bids);

                document.getElementById('itemDetails').innerHTML = `
                    <h4>${item.title}</h4>
                    <p>${item.description}</p>
                    ${item.biddingEnabled ? 
                        `<p><strong>Starting Bid:</strong> $${item.startingPrice}</p>
                         <p><strong>Current Bid:</strong> $${item.currentPrice || item.startingPrice}</p>
                         <p><strong>Buy Now Price:</strong> $${item.buyNowPrice}</p>
                         <p><strong>Ends:</strong> ${new Date(item.endTime).toLocaleString()}</p>` 
                        : 
                        `<p><strong>Price:</strong> $${item.price}</p>`
                    }
                `;

                const bidHistory = document.getElementById('bidHistory');
                if (bids && bids.length > 0) {
                    bidHistory.innerHTML = bids.map(bid => `
                        <div class="border-bottom p-2">
                            <small>Bid: $${bid.amount} by ${bid.user.email}</small>
                        </div>
                    `).join('');
                } else {
                    bidHistory.innerHTML = '<p class="text-muted">No bids yet</p>';
                }

                // Show/hide bidding section based on item type
                const biddingSection = document.querySelector('.modal-body .mt-3');
                if (biddingSection) {
                    biddingSection.style.display = item.biddingEnabled ? 'block' : 'none';
                }

                modal.show();
            } catch (error) {
                console.error('Error loading item details:', error);
                if (error.message.includes('401') || error.message.includes('403') || error.message.includes('No authentication token found')) {
                    alert('Your session has expired. Please log in again.');
                    showLoginForm();
                } else {
                    alert('Error loading item details: ' + error.message);
                }
            }
        }

        async function placeBid() {
            const amount = document.getElementById('bidAmount').value;
            if (!amount || amount <= 0) {
                alert('Please enter a valid bid amount.');
                return;
            }

            try {
                const response = await fetch(`/items/${currentItemId}/bid?amount=${amount}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                if (response.ok) {
                    alert('Bid placed successfully!');
                    showItemDetails(currentItemId);
                } else {
                    alert('Failed to place bid. Please try again.');
                }
            } catch (error) {
                console.error('Error placing bid:', error);
                alert('Error placing bid.');
            }
        }

        async function buyNow() {
            try {
                const response = await fetch(`/items/${currentItemId}/buy-now`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });

                if (response.ok) {
                    alert('Item purchased successfully!');
                    modal.hide();
                    loadItems();
                } else {
                    alert('Failed to purchase item. Please try again.');
                }
            } catch (error) {
                console.error('Error buying item:', error);
                alert('Error buying item.');
            }
        }

        function showCreateItemForm() {
            document.getElementById('createItemForm').reset();
            document.getElementById('biddingOptions').style.display = 'none';
            createItemModal.show();
        }

        document.getElementById('enableBidding').addEventListener('change', function() {
            const biddingOptions = document.getElementById('biddingOptions');
            const regularPriceSection = document.getElementById('regularPriceSection');
            if (this.checked) {
                biddingOptions.style.display = 'block';
                regularPriceSection.style.display = 'none';
                document.getElementById('itemPrice').required = false;
                document.getElementById('startingPrice').required = true;
                document.getElementById('itemBuyNowPrice').required = true;
                document.getElementById('endTime').required = true;
            } else {
                biddingOptions.style.display = 'none';
                regularPriceSection.style.display = 'block';
                document.getElementById('itemPrice').required = true;
                document.getElementById('startingPrice').required = false;
                document.getElementById('itemBuyNowPrice').required = false;
                document.getElementById('endTime').required = false;
            }
        });

        async function createItem() {
            const title = document.getElementById('itemTitle').value;
            const description = document.getElementById('itemDescription').value;
            const enableBidding = document.getElementById('enableBidding').checked;
            
            if (!title || !description) {
                alert('Please fill in all required fields');
                return;
            }

            try {
                const token = getCurrentToken();
                let itemData = {
                    title,
                    description,
                    biddingEnabled: enableBidding
                };

                if (enableBidding) {
                    const startingPrice = parseFloat(document.getElementById('startingPrice').value);
                    const buyNowPrice = parseFloat(document.getElementById('itemBuyNowPrice').value);
                    const endTime = document.getElementById('endTime').value;

                    if (!startingPrice || !buyNowPrice || !endTime) {
                        alert('Please fill in all bidding fields');
                        return;
                    }

                    itemData = {
                        ...itemData,
                        startingPrice,
                        buyNowPrice,
                        endTime: new Date(endTime).toISOString(),
                        price: startingPrice  // Set price to starting price for bidding items
                    };
                } else {
                    const price = parseFloat(document.getElementById('itemPrice').value);
                    if (!price) {
                        alert('Please enter a price');
                        return;
                    }
                    itemData = {
                        ...itemData,
                        price
                    };
                }

                const response = await fetch('/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(itemData)
                });

                if (response.ok) {
                    alert('Item created successfully!');
                    createItemModal.hide();
                    loadItems();
                } else {
                    const error = await response.text();
                    alert('Failed to create item: ' + error);
                }
            } catch (error) {
                console.error('Error creating item:', error);
                if (error.message.includes('No authentication token found')) {
                    alert('Your session has expired. Please log in again.');
                    showLoginForm();
                } else {
                    alert('An error occurred while creating the item');
                }
            }
        }

        function showLoginForm() {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('itemsSection').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            localStorage.removeItem('token');
            currentToken = '';
        }

        // Add this function to check authentication status on page load
        function checkAuthStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                currentToken = token;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('itemsSection').style.display = 'block';
                loadItems();
            } else {
                showLoginForm();
            }
        }

        // Call checkAuthStatus when the page loads
        document.addEventListener('DOMContentLoaded', checkAuthStatus);

        async function loadItems() {
            try {
                const token = getCurrentToken();
                console.log('Loading items with token:', token);
                
                const response = await fetch('/items', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                console.log('Items response status:', response.status);
                const responseText = await response.text();
                console.log('Items response text:', responseText);

                if (!response.ok) {
                    throw new Error(`Failed to load items: ${response.status}`);
                }

                const items = JSON.parse(responseText);
                if (!Array.isArray(items)) {
                    throw new Error('Invalid response format: expected an array of items');
                }

                const itemsList = document.getElementById('itemsList');
                itemsList.innerHTML = items.map(item => `
                    <div class="col-md-4">
                        <div class="card item-card">
                            <div class="card-body">
                                <h5 class="card-title">${item.title}</h5>
                                <p class="card-text">${item.description}</p>
                                ${item.biddingEnabled ? 
                                    `<p><strong>Current Bid:</strong> $${item.currentPrice || item.startingPrice}</p>
                                     <p><strong>Buy Now:</strong> $${item.buyNowPrice}</p>
                                     <p><strong>Ends:</strong> ${new Date(item.endTime).toLocaleString()}</p>` 
                                    : 
                                    `<p><strong>Price:</strong> $${item.price}</p>`
                                }
                                <button class="btn btn-primary" onclick="showItemDetails(${item.id})">View Details</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading items:', error);
                if (error.message.includes('401') || error.message.includes('403') || error.message.includes('No authentication token found')) {
                    alert('Your session has expired. Please log in again.');
                    showLoginForm();
                } else {
                    alert('Error loading items: ' + error.message);
                }
            }
        }

        // Add this function to handle logout
        function logout() {
            // Clear the token from localStorage
            localStorage.removeItem('token');
            currentToken = '';
            
            // Show the login form
            showLoginForm();
            
            // Clear any existing items
            document.getElementById('itemsList').innerHTML = '';
            
            // Show success message
            alert('You have been successfully logged out.');
        }
    </script>
</body>
</html>
